<!DOCTYPE html>
<html lang="en" translate="yes">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <meta http-equiv="content-language" content="en">
    <title>My Movie Journal - TRNTIO</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #171010; color: #e2e8f0; margin: 0; padding: 0; }
        
        /* Navbar */
        .navbar { background: #1a1a1a; padding: 10px 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 999; flex-wrap: wrap; gap: 10px; }
        .navbar-brand { font-size: 1.2rem; font-weight: bold; color: wheat; display: flex; align-items: center; gap: 8px; }
        .navbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; width: 100%; }
        .navbar-btn { background: #2B2B2B; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .navbar-btn:hover { background: #000000; }
        .navbar-btn span:last-child { display: none; }
        @media (min-width: 640px) {
            .navbar { padding: 12px 20px; gap: 15px; }
            .navbar-brand { font-size: 1.3rem; gap: 10px; }
            .navbar-actions { width: auto; gap: 10px; }
            .navbar-btn { padding: 8px 14px; font-size: 14px; gap: 6px; }
            .navbar-btn span:last-child { display: inline; }
        }
        @media (min-width: 768px) {
            .navbar { padding: 15px 30px; }
            .navbar-brand { font-size: 1.5rem; }
            .navbar-btn { padding: 8px 16px; }
        }
        .navbar-btn.export { background: #10b981; }
        .navbar-btn.export:hover { background: #059669; }
        .navbar-btn.import { background: #3b82f6; }
        .navbar-btn.import:hover { background: #2563eb; }
        .navbar-btn.print { background: #8b5cf6; }
        .navbar-btn.print:hover { background: #7c3aed; }
        #importFile { display: none; }
        
        .container { max-width: 2000px; margin: auto; padding: 20px; }
        
        /* Responsive Layout - 3 Columns */
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 1400px) {
            .main-content { flex-direction: row; }
            .column { flex: 1; transition: all 0.3s ease; position: relative; min-width: 0; }
            .column.collapsed { flex: 0 0 50px; min-width: 50px; }
            .column.collapsed .column-content { display: none; }
        }
        
        /* Toggle Button */
        .toggle-btn { position: absolute; top: 10px; right: 10px; background: #2B2B2B; color: white; width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; z-index: 10; transition: 0.3s; }
        .toggle-btn:hover { background: #000000; }
        .sidebar-tab { display: none; }
        @media (min-width: 1400px) {
            .collapsed .sidebar-tab { display: flex; writing-mode: vertical-rl; text-orientation: mixed; background: #2B2B2B; height: 100%; align-items: center; justify-content: center; font-weight: bold; color: wheat; cursor: pointer; border-radius: 8px; padding: 20px 15px; }
            .collapsed .toggle-btn { display: none; }
        }
        
        /* Search Container */
        .search-container { background: #2B2B2B; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; }
        select { padding: 12px; border-radius: 8px; border: 1px solid #423F3E; background: #171010; color: white; outline: none; cursor: pointer; }
        select:focus { border-color: #888; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #423F3E; background: #171010; color: white; outline: none; }
        input:focus { border-color: #888; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-search { background: #2B2B2B; color: white; }
        .btn-search:hover { background: #000000; }
        
        /* Grid Layout */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media (min-width: 640px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        }
        .movie-card { background: #171010; border-radius: 10px; overflow: hidden; transition: transform 0.2s; position: relative; border: 1px solid #423F3E; cursor: pointer; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card img { width: 100%; height: 260px; object-fit: cover; }
        .info-btn { position: absolute; top: 8px; right: 8px; background: rgba(43, 43, 43, 0.7); color: white; width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; z-index: 5; }
        .info-btn:hover { background: rgba(0, 0, 0, 0.9); transform: scale(1.1); }
        .movie-info { padding: 12px; text-align: center; }
        .movie-info h4 { margin: 0 0 8px 0; font-size: 14px; height: 35px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        /* Button Styles */
        .btn-group { display: flex; gap: 5px; margin-top: 5px; }
        .btn-group-watchlist { display: flex; gap: 5px; margin-top: 5px; }
        .btn-add { background: #10b981; color: white; flex: 1; padding: 8px 12px; font-size: 13px; }
        .btn-add:hover { background: #059669; }
        .btn-watchlist { background: #f59e0b; color: white; flex: 1; padding: 8px 12px; font-size: 13px; }
        .btn-watchlist:hover { background: #d97706; }
        .btn-watched { background: #10b981; color: white; flex: 1; padding: 8px 10px; font-size: 12px; }
        .btn-watched:hover { background: #059669; }
        .btn-remove { background: #ef4444; color: white; flex: 1; padding: 8px 10px; font-size: 12px; }
        .btn-remove:hover { background: #dc2626; }
        
        h2 { font-size: 1.5rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: rgba(255, 255, 255, 0.8); }
        .loader { display: none; text-align: center; margin: 10px; color: rgba(255, 255, 255, 0.7); }
        
        /* Collapsible Year Sections */
        .year-section { margin-bottom: 20px; }
        .year-header { background: #2B2B2B; padding: 15px 20px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #423F3E; transition: 0.3s; }
        .year-header:hover { background: #000000; }
        .year-title { font-size: 1.2rem; font-weight: bold; color: white; }
        .year-count { color: #bbb; font-size: 0.9rem; margin-left: 10px; }
        .year-toggle { color: white; font-size: 1.5rem; transition: transform 0.3s; }
        .year-toggle.collapsed { transform: rotate(-90deg); }
        .year-content { margin-top: 15px; overflow: hidden; transition: max-height 0.3s ease; }
        .year-content.collapsed { display: none; }
        
        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); animation: fadeIn 0.3s; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #2B2B2B; margin: auto; padding: 0; border-radius: 12px; max-width: 600px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); animation: slideIn 0.3s; }
        #detailModal .modal-content { max-width: 900px; }
        .modal-header { padding: 20px; border-bottom: 1px solid #423F3E; }
        .modal-header h3 { margin: 0; color: white; }
        .modal.add-modal .modal-header { background: rgba(16, 185, 129, 0.1); }
        .modal.add-modal .modal-header h3 { color: #10b981; }
        .modal.watchlist-modal .modal-header { background: rgba(245, 158, 11, 0.1); }
        .modal.watchlist-modal .modal-header h3 { color: #f59e0b; }
        .modal.remove-modal .modal-header { background: rgba(239, 68, 68, 0.1); }
        .modal.remove-modal .modal-header h3 { color: #ef4444; }
        .modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid #423F3E; display: flex; gap: 10px; justify-content: flex-end; }
        .modal-btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .modal-btn.confirm { background: #10b981; color: white; }
        .modal-btn.confirm:hover { background: #059669; }
        .modal-btn.cancel { background: #ef4444; color: white; }
        .modal-btn.cancel:hover { background: #dc2626; }
        .detail-row { margin-bottom: 15px; }
        .detail-label { color: #bbb; font-size: 0.9rem; margin-bottom: 5px; }
        .detail-value { color: #e2e8f0; }
        .imdb-btn { display: inline-flex; align-items: center; gap: 8px; background: #f5c518; color: #000; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; transition: 0.2s; }
        .imdb-btn:hover { background: #f6d860; transform: translateY(-2px); }
        .movie-poster-large { width: 100%; max-width: 300px; border-radius: 8px; margin: 0 auto 20px; display: block; }
        .detail-content-wrapper { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 768px) {
            .detail-content-wrapper { flex-direction: row; align-items: flex-start; }
            .detail-poster-section { flex: 0 0 300px; }
            .detail-info-section { flex: 1; min-width: 0; }
            .movie-poster-large { margin: 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Print Styles */
        @media print {
            body { background: white; color: black; }
            .navbar, .toggle-btn, .sidebar-tab, .search-container, button, .info-btn { display: none !important; }
            .column { page-break-inside: avoid; }
            .movie-card { border: 1px solid #ddd; page-break-inside: avoid; }
        }
        
        /* Toast Notification */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
        .toast { background: #2B2B2B; border-left: 4px solid #888; border-radius: 8px; padding: 15px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 15px; animation: slideInToast 0.3s ease; transition: opacity 0.3s; }
        .toast.success { border-left-color: #10b981; }
        .toast.warning { border-left-color: #f59e0b; }
        .toast.error { border-left-color: #ef4444; }
        .toast.fading { opacity: 0.5; }
        .toast:hover { opacity: 1 !important; }
        .toast-icon { font-size: 24px; flex-shrink: 0; }
        .toast-content { flex: 1; }
        .toast-message { color: #e2e8f0; font-size: 14px; margin-bottom: 8px; }
        .toast-undo { background: #2B2B2B; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .toast-undo:hover { background: #000000; }
        .toast-close { background: transparent; border: none; color: #bbb; cursor: pointer; font-size: 20px; padding: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .toast-close:hover { color: white; }
        @keyframes slideInToast { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutToast { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-brand">
        <span>🎬</span>
        <span>My Movie Journal</span>
    </div>
    <div class="navbar-actions">
        <select id="printLanguage" class="navbar-btn" style="cursor: pointer;" onchange="changeLanguage(this.value)">
            <option value="tr" selected>🇹🇷 Türkçe</option>
            <option value="en">🇬🇧 English</option>
        </select>
        <button class="navbar-btn export" onclick="exportData()">
            <span>⬇️</span> <span data-i18n="export">Dışa Aktar</span>
        </button>
        <button class="navbar-btn import" onclick="document.getElementById('importFile').click()">
            <span>⬆️</span> <span data-i18n="import">İçe Aktar</span>
        </button>
        <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        <button class="navbar-btn print" onclick="printMovies()">
            <span>🖨️</span> <span data-i18n="print">Yazdır</span>
        </button>
    </div>
</nav>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="main-content">
        <!-- Discover Movies -->
        <div class="column" id="discoverColumn">
            <button class="toggle-btn" onclick="toggleColumn('discover')" title="Close">◀</button>
            <div class="sidebar-tab" onclick="toggleColumn('discover')">🔍 DISCOVER</div>
            <div class="column-content">
                <div class="search-container">
                    <h2>🔍 <span data-i18n="discoverMovies">Yeni Filmler Keşfet</span></h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Film adı girin (ör: Inception)...">
                        <button class="btn-search" onclick="searchMovies()" data-i18n="searchButton">Ara</button>
                    </div>
                    <div id="loader" class="loader" data-i18n="searching">Aranıyor...</div>
                </div>
                <div id="searchResults"></div>
            </div>
        </div>
        
        <!-- Watchlist -->
        <div class="column" id="watchlistColumn">
            <button class="toggle-btn" onclick="toggleColumn('watchlist')" title="Close">◀</button>
            <div class="sidebar-tab" onclick="toggleColumn('watchlist')">📋 WATCHLIST</div>
            <div class="column-content">
                <div class="search-container">
                    <h2>📋 <span data-i18n="myWatchlist">Watchlist'im</span></h2>
                    <div class="search-box">
                        <input type="text" id="filterWatchlistInput" data-i18n-placeholder="searchInList" placeholder="Listede ara..." oninput="filterWatchlistMovies()">
                        <select id="sortWatchlistSelect" onchange="filterWatchlistMovies()">
                            <option value="addedDateDesc" data-i18n="addedDateDesc">Eklenme Tarihi (Yeni → Eski)</option>
                            <option value="addedDateAsc" data-i18n="addedDateAsc">Eklenme Tarihi (Eski → Yeni)</option>
                            <option value="releaseDateDesc" data-i18n="releaseDateDesc">Yayın Tarihi (Yeni → Eski)</option>
                            <option value="releaseDateAsc" data-i18n="releaseDateAsc">Yayın Tarihi (Eski → Yeni)</option>
                        </select>
                    </div>
                </div>
                <div id="watchlistList"></div>
            </div>
        </div>
        
        <!-- Watched Movies -->
        <div class="column" id="watchedColumn">
            <button class="toggle-btn" onclick="toggleColumn('watched')" title="Close">▶</button>
            <div class="sidebar-tab" onclick="toggleColumn('watched')">✅ WATCHED</div>
            <div class="column-content">
                <div class="search-container">
                    <h2>✅ <span data-i18n="watchedMovies">İzlediğim Filmler</span></h2>
                    <div class="search-box">
                        <input type="text" id="filterInput" data-i18n-placeholder="searchInList" placeholder="Listede ara..." oninput="filterWatchedMovies()">
                        <select id="sortSelect" onchange="filterWatchedMovies()">
                            <option value="watchDateDesc" data-i18n="watchDateDesc">İzleme Tarihi (Yeni → Eski)</option>
                            <option value="watchDateAsc" data-i18n="watchDateAsc">İzleme Tarihi (Eski → Yeni)</option>
                            <option value="releaseDateDesc" data-i18n="releaseDateDesc">Yayın Tarihi (Yeni → Eski)</option>
                            <option value="releaseDateAsc" data-i18n="releaseDateAsc">Yayın Tarihi (Eski → Yeni)</option>
                        </select>
                    </div>
                </div>
                <div id="watchedList"></div>
            </div>
        </div>
    </div>
</div>

<!-- Confirmation Modal -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Confirmation</h3>
        </div>
        <div class="modal-body">
            <div style="display: flex; gap: 20px; align-items: start;">
                <img id="modalPoster" src="" alt="" style="display: none; width: 80px; height: 120px; object-fit: cover; border-radius: 8px; flex-shrink: 0;">
                <p id="modalMessage" style="flex: 1;"></p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn cancel" onclick="closeModal(false)">No (N / ESC)</button>
            <button class="modal-btn confirm" onclick="closeModal(true)">Yes (Y / ENTER / SPACE)</button>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 id="detailTitle" style="margin: 0;">Movie Details</h3>
            <a id="detailImdbBtn" href="#" target="_blank" rel="noopener noreferrer" class="imdb-btn" style="display: none; margin: 0;">
                <span>View on IMDb</span>
                <span>🔗</span>
            </a>
        </div>
        <div class="modal-body" id="detailBody">
            <div style="text-align: center; padding: 20px;">
                <div class="loader" style="display: block;">Loading...</div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="modal-btn cancel" onclick="closeDetailModal()">Close (ESC)</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://v3-cinemeta.strem.io/catalog";
    let watchedMovies = JSON.parse(localStorage.getItem('trnt_movies')) || [];
    let watchlistMovies = JSON.parse(localStorage.getItem('trnt_watchlist')) || [];
    let modalCallback = null;
    let currentModal = null;
    let toastCounter = 0;

    // Language Translations
    const translations = {
        tr: {
            export: 'Dışa Aktar',
            import: 'İçe Aktar',
            print: 'Yazdır',
            discoverMovies: 'Yeni Filmler Keşfet',
            searchPlaceholder: 'Film adı girin (ör: Inception)...',
            searchButton: 'Ara',
            searching: 'Aranıyor...',
            myWatchlist: 'Watchlist\'im',
            searchInList: 'Listede ara...',
            addedDateDesc: 'Eklenme Tarihi (Yeni → Eski)',
            addedDateAsc: 'Eklenme Tarihi (Eski → Yeni)',
            releaseDateDesc: 'Yayın Tarihi (Yeni → Eski)',
            releaseDateAsc: 'Yayın Tarihi (Eski → Yeni)',
            watchedMovies: 'İzlediğim Filmler',
            watchDateDesc: 'İzleme Tarihi (Yeni → Eski)',
            watchDateAsc: 'İzleme Tarihi (Eski → Yeni)',
            noMoviesFound: 'Film bulunamadı.',
            apiError: 'API bağlantı hatası.',
            exportSuccess: 'Veriler başarıyla dışa aktarıldı!',
            importSuccess: 'Veriler başarıyla içe aktarıldı!',
            importError: 'Veri içe aktarılması hatası. Lütfen dosya formatını kontrol edin.',
            alreadyWatched: 'zaten izlediğim listede!',
            alreadyInWatchlist: 'zaten watchlist\'te!',
            addedToWatchlist: 'watchlist\'e eklendi!',
            removedFromWatchlist: 'watchlist\'ten çıkarıldı.',
            markedAsWatched: 'izlendi olarak işaretlendi!',
            movedToWatched: 'watchlist\'ten izlendi\'ye taşındı!',
            undoSuccess: 'Geri alma başarılı:',
            restored: 'geri yüklendi.',
            noMoviesInWatchlist: 'Watchlist\'te film yok.',
            noWatchedMovies: 'İzlenmiş film bulunamadı.',
            movies: 'film'
        },
        en: {
            export: 'Export',
            import: 'Import',
            print: 'Print',
            discoverMovies: 'Discover New Movies',
            searchPlaceholder: 'Enter movie name (e.g., Inception)...',
            searchButton: 'Search',
            searching: 'Searching...',
            myWatchlist: 'My Watchlist',
            searchInList: 'Search in list...',
            addedDateDesc: 'Added Date (New → Old)',
            addedDateAsc: 'Added Date (Old → New)',
            releaseDateDesc: 'Release Date (New → Old)',
            releaseDateAsc: 'Release Date (Old → New)',
            watchedMovies: 'Watched Movies',
            watchDateDesc: 'Watch Date (New → Old)',
            watchDateAsc: 'Watch Date (Old → New)',
            noMoviesFound: 'No movies found.',
            apiError: 'API connection error.',
            exportSuccess: 'Data exported successfully!',
            importSuccess: 'Data imported successfully!',
            importError: 'Error importing data. Please check the file format.',
            alreadyWatched: 'is already in your watched list!',
            alreadyInWatchlist: 'is already in your watchlist!',
            addedToWatchlist: 'added to watchlist!',
            removedFromWatchlist: 'removed from watchlist.',
            markedAsWatched: 'marked as watched!',
            movedToWatched: 'moved from watchlist to watched!',
            undoSuccess: 'Undo successful:',
            restored: 'restored.',
            noMoviesInWatchlist: 'No movies in watchlist.',
            noWatchedMovies: 'No watched movies found.',
            movies: 'movies'
        }
    };

    // Get current language (default Turkish)
    let currentLang = localStorage.getItem('appLanguage') || 'tr';
    
    // Set language dropdown on page load
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('printLanguage').value = currentLang;
        updatePageLanguage();
    });

    // Change Language Function
    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLanguage', lang);
        updatePageLanguage();
        
        // Refresh lists to update month names
        displayWatchlistMovies();
        displayWatchedMovies();
    }

    // Update all text on page
    function updatePageLanguage() {
        const lang = translations[currentLang];
        
        // Update all elements with data-i18n
        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.getAttribute('data-i18n');
            if (lang[key]) {
                element.textContent = lang[key];
            }
        });
        
        // Update placeholders
        document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
            const key = element.getAttribute('data-i18n-placeholder');
            if (lang[key]) {
                element.placeholder = lang[key];
            }
        });
        
        // Update select options
        document.querySelectorAll('option[data-i18n]').forEach(option => {
            const key = option.getAttribute('data-i18n');
            if (lang[key]) {
                option.textContent = lang[key];
            }
        });
    }

    // Get translated text
    function t(key) {
        return translations[currentLang][key] || key;
    }

    // Toast Notification System
    function showToast(message, type = 'success', undoCallback = null) {
        const container = document.getElementById('toastContainer');
        const toastId = `toast-${toastCounter++}`;
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.id = toastId;
        
        const icon = type === 'success' ? '✅' : type === 'warning' ? '⚠️' : type === 'error' ? '❌' : 'ℹ️';
        
        toast.innerHTML = `
            <span class="toast-icon">${icon}</span>
            <div class="toast-content">
                <div class="toast-message">${message}</div>
                ${undoCallback ? '<button class="toast-undo" onclick="undoToastAction(\'' + toastId + '\')">↶ Undo</button>' : ''}
            </div>
            <button class="toast-close" onclick="closeToast(\'' + toastId + '\')">×</button>
        `;
        
        container.appendChild(toast);
        
        // Store undo callback
        if (undoCallback) {
            toast.undoCallback = undoCallback;
        }
        
        // Fade to semi-transparent after 5 seconds
        const fadeTimeout = setTimeout(() => {
            toast.classList.add('fading');
        }, 5000);
        
        // Auto close after 10 seconds
        const closeTimeout = setTimeout(() => {
            closeToast(toastId);
        }, 10000);
        
        // Store timeouts for cleanup
        toast.fadeTimeout = fadeTimeout;
        toast.closeTimeout = closeTimeout;
    }
    
    function closeToast(toastId) {
        const toast = document.getElementById(toastId);
        if (toast) {
            clearTimeout(toast.fadeTimeout);
            clearTimeout(toast.closeTimeout);
            toast.style.animation = 'slideOutToast 0.3s ease';
            setTimeout(() => {
                toast.remove();
            }, 300);
        }
    }
    
    function undoToastAction(toastId) {
        const toast = document.getElementById(toastId);
        if (toast && toast.undoCallback) {
            toast.undoCallback();
            closeToast(toastId);
        }
    }

    // Export Data
    function exportData() {
        const data = {
            watched: watchedMovies,
            watchlist: watchlistMovies,
            exportDate: new Date().toISOString()
        };
        
        const dataStr = JSON.stringify(data, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `movie-journal-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        
        URL.revokeObjectURL(url);
        showToast(t('exportSuccess'), 'success');
    }
    
    // Import Data
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                
                if (data.watched && Array.isArray(data.watched)) {
                    watchedMovies = data.watched;
                    localStorage.setItem('trnt_movies', JSON.stringify(watchedMovies));
                    displayWatchedMovies();
                }
                
                if (data.watchlist && Array.isArray(data.watchlist)) {
                    watchlistMovies = data.watchlist;
                    localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
                    displayWatchlistMovies();
                }
                
                showToast(`${t('importSuccess')} ${data.watched?.length || 0} ${t('watched')}, ${data.watchlist?.length || 0} watchlist.`, 'success');
            } catch (error) {
                showToast(t('importError'), 'error');
                console.error('Import error:', error);
            }
        };
        reader.readAsText(file);
        
        // Reset input
        event.target.value = '';
    }

            const month = date.getMonth();

                moviesByYear[year] = {};

    // Search Movies
    async function searchMovies() {
        const query = document.getElementById('searchInput').value;
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('searchResults');

        if (!query) return;

        loader.style.display = "block";
        resultsDiv.innerHTML = "";

        try {
            const contentType = 'movie';
            const response = await fetch(`${API_BASE}/${contentType}/top/search=${encodeURIComponent(query)}.json`, {
                headers: {
                    'Accept': '*/*',
                    'User-Agent': 'Mozilla/5.0',
                    'Origin': 'https://app.strem.io',
                    'Referer': 'https://app.strem.io/shell-v4.4/'
                }
            });
            const data = await response.json();

            loader.style.display = "none";

            if (data.metas && data.metas.length > 0) {
                displayResults(data.metas);
            } else {
                resultsDiv.innerHTML = `<p>${t('noMoviesFound')}</p>`;
            }
        } catch (error) {
            console.error("Error:", error);
            loader.style.display = "none";
            alert(t('apiError'));
        }
    }

    // Display Search Results
    function displayResults(movies) {
        const resultsDiv = document.getElementById('searchResults');
        
        const moviesByYear = {};
        movies.forEach(movie => {
            const year = movie.releaseInfo || movie.year || 'Unknown';
            if (!moviesByYear[year]) {
                moviesByYear[year] = [];
            }
            moviesByYear[year].push(movie);
        });
        
        const sortedYears = Object.keys(moviesByYear).sort((a, b) => {
            if (a === 'Unknown') return 1;
            if (b === 'Unknown') return -1;
            return b - a;
        });
        
        sortedYears.forEach((year, index) => {
            const yearMovies = moviesByYear[year];
            const isFirstYear = index === 0;
            
            const yearSection = document.createElement('div');
            yearSection.className = 'year-section';
            
            const yearHeader = document.createElement('div');
            yearHeader.className = 'year-header';
            yearHeader.onclick = () => toggleYear(year);
            yearHeader.innerHTML = `
                <div>
                    <span class="year-title">${year}</span>
                    <span class="year-count">(${yearMovies.length} ${t('movies')})</span>
                </div>
                <span class="year-toggle ${isFirstYear ? '' : 'collapsed'}" id="toggle-${year}">▼</span>
            `;
            
            const yearContent = document.createElement('div');
            yearContent.className = `year-content ${isFirstYear ? '' : 'collapsed'}`;
            yearContent.id = `content-${year}`;
            
            const yearGrid = document.createElement('div');
            yearGrid.className = 'grid';
            
            yearMovies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                const poster = movie.poster || 'https://via.placeholder.com/180x260?text=No+Image';
                const name = movie.name || 'Unknown';
                const releaseInfo = movie.releaseInfo || movie.year || 'Unknown';
                
                card.innerHTML = `
                    <button class="info-btn" onclick="event.stopPropagation(); showMovieDetail('${movie.id}', '${movie.type || 'movie'}')" title="View Details">ℹ️</button>
                    <img src="${poster}" alt="${name}" onclick="showMovieDetail('${movie.id}', '${movie.type || 'movie'}')">
                    <div class="movie-info">
                        <h4><span translate="no">${name}</span></h4>
                        <div class="btn-group">
                            <button class="btn-watchlist" onclick="confirmAddToWatchlist('${movie.id}', '${encodeURIComponent(name)}', '${poster}', '${releaseInfo}')">📝 Watchlist</button>
                            <button class="btn-add" onclick="confirmSaveMovie('${movie.id}', '${encodeURIComponent(name)}', '${poster}', '${releaseInfo}')">✓ Watched</button>
                        </div>
                    </div>
                `;
                yearGrid.appendChild(card);
            });
            
            yearContent.appendChild(yearGrid);
            yearSection.appendChild(yearHeader);
            yearSection.appendChild(yearContent);
            resultsDiv.appendChild(yearSection);
        });
    }
    
    function toggleYear(year) {
        const content = document.getElementById(`content-${year}`);
        const toggle = document.getElementById(`toggle-${year}`);
        
        content.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed');

    // Add to Watchlist
    function confirmAddToWatchlist(id, name, poster, releaseInfo) {
        const decodedName = decodeURIComponent(name);
        
        if (watchedMovies.some(m => m.id === id)) {
            showToast(`"${decodedName}" ${t('alreadyWatched')}`, 'warning');
            return;
        }
        
        if (watchlistMovies.some(m => m.id === id)) {
            showToast(`"${decodedName}" ${t('alreadyInWatchlist')}`, 'warning');
            return;
        }
        
        const movieObj = { 
            id, 
            name: decodedName, 
            poster,
            releaseInfo: releaseInfo || 'Unknown',
            addedDate: new Date().toISOString()
        };
        watchlistMovies.push(movieObj);
        localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
        displayWatchlistMovies();
        
        // Show success toast with undo
        showToast(`"${decodedName}" ${t('addedToWatchlist')}`, 'success', () => {
            watchlistMovies = watchlistMovies.filter(m => m.id !== id);
            localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
            displayWatchlistMovies();
            showToast(`${t('undoSuccess')} "${decodedName}" ${t('removedFromWatchlist')}`, 'success');
        });
    }

    // Add to Watched
    function confirmSaveMovie(id, name, poster, releaseInfo) {
        const decodedName = decodeURIComponent(name);
        
        if (watchedMovies.some(m => m.id === id)) {
            showToast(`"${decodedName}" ${t('alreadyWatched')}`, 'warning');
            return;
        }
        
        // Check if in watchlist
        const inWatchlist = watchlistMovies.some(m => m.id === id);
        
        const movieObj = { 
            id, 
            name: decodedName, 
            poster,
            releaseInfo: releaseInfo || 'Unknown',
            addedDate: new Date().toISOString()
        };
        
        // Store old watchlist state for undo
        const wasInWatchlist = inWatchlist;
        let removedFromWatchlist = null;
        
        if (wasInWatchlist) {
            removedFromWatchlist = watchlistMovies.find(m => m.id === id);
            watchlistMovies = watchlistMovies.filter(m => m.id !== id);
            localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
            displayWatchlistMovies();
        }
        
        watchedMovies.push(movieObj);
        localStorage.setItem('trnt_movies', JSON.stringify(watchedMovies));
        displayWatchedMovies();
        
        // Show success toast with undo
        const message = wasInWatchlist 
            ? `"${decodedName}" ${t('movedToWatched')}` 
            : `"${decodedName}" ${t('markedAsWatched')}`;
            
        showToast(message, 'success', () => {
            // Undo: remove from watched
            watchedMovies = watchedMovies.filter(m => m.id !== id);
            localStorage.setItem('trnt_movies', JSON.stringify(watchedMovies));
            displayWatchedMovies();
            
            // Restore to watchlist if it was there
            if (wasInWatchlist && removedFromWatchlist) {
                watchlistMovies.push(removedFromWatchlist);
                localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
                displayWatchlistMovies();
            }
            
            showToast(`${t('undoSuccess')} "${decodedName}" ${t('restored')}`, 'success');
        });
    }

    // Display Watchlist
    function displayWatchlistMovies(filterText = '') {
        const listDiv = document.getElementById('watchlistList');
        listDiv.innerHTML = '';
        const sortValue = document.getElementById('sortWatchlistSelect') ? document.getElementById('sortWatchlistSelect').value : 'addedDateDesc';

        let filteredMovies = watchlistMovies.filter(movie => {
            const name = movie.name || movie.title || 'Unknown';
            return name.toLowerCase().includes(filterText.toLowerCase());
        });

        if (filteredMovies.length === 0) {
            listDiv.innerHTML = `<p style="text-align: center; color: #94a3b8; padding: 20px;">${t('noMoviesInWatchlist')}</p>`;
            return;
        }

        const isAddedDate = sortValue.startsWith('addedDate');
        const isDescending = sortValue.endsWith('Desc');

        const moviesByYear = {};
        filteredMovies.forEach(movie => {
            let year, month;
            
            if (isAddedDate) {
                const date = movie.addedDate ? new Date(movie.addedDate) : new Date();
                year = date.getFullYear();
                month = date.getMonth();
            } else {
                year = parseInt(movie.releaseInfo) || 0;
                month = null;
            }
            
            if (!moviesByYear[year]) {
                moviesByYear[year] = {};
            }
            
            if (month !== null) {
                if (!moviesByYear[year][month]) {
                    moviesByYear[year][month] = [];
                }
                moviesByYear[year][month].push(movie);
            } else {
                if (!moviesByYear[year]['all']) {
                    moviesByYear[year]['all'] = [];
                }
                moviesByYear[year]['all'].push(movie);
            }
        });

        const sortedYears = Object.keys(moviesByYear).sort((a, b) => {
            return isDescending ? b - a : a - b;
        });

        const monthNames = currentLang === 'tr' 
            ? ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık']
            : ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        sortedYears.forEach((year, yearIndex) => {
            const yearData = moviesByYear[year];
            const isFirstYear = yearIndex === 0;
            
            let totalCount = 0;
            Object.keys(yearData).forEach(monthKey => {
                totalCount += yearData[monthKey].length;
            });
            
            const yearSection = document.createElement('div');
            yearSection.className = 'year-section';
            
            const yearHeader = document.createElement('div');
            yearHeader.className = 'year-header';
            yearHeader.onclick = () => toggleWatchlistYear(year);
            yearHeader.innerHTML = `
                <div>
                    <span class="year-title">${year}</span>
                    <span class="year-count">(${totalCount} ${t('movies')})</span>
                </div>
                <span class="year-toggle ${isFirstYear ? '' : 'collapsed'}" id="toggle-watchlist-${year}">▼</span>
            `;
            
            const yearContent = document.createElement('div');
            yearContent.className = `year-content ${isFirstYear ? '' : 'collapsed'}`;
            yearContent.id = `content-watchlist-${year}`;
            
            if (isAddedDate) {
                const sortedMonths = Object.keys(yearData).sort((a, b) => {
                    return isDescending ? b - a : a - b;
                });
                
                sortedMonths.forEach((monthKey, monthIndex) => {
                    const monthMovies = yearData[monthKey];
                    const monthName = monthNames[parseInt(monthKey)];
                    
                    if (monthIndex > 0) {
                        const divider = document.createElement('hr');
                        divider.style.cssText = 'border: 0; border-top: 1px solid #334155; margin: 20px 0;';
                        yearContent.appendChild(divider);
                    }
                    
                    const monthTitle = document.createElement('h3');
                    monthTitle.style.cssText = 'color: #94a3b8; font-size: 1rem; margin-bottom: 15px; font-weight: 600;';
                    monthTitle.textContent = `${monthName} (${monthMovies.length})`;
                    yearContent.appendChild(monthTitle);
                    
                    const monthGrid = document.createElement('div');
                    monthGrid.className = 'grid';
                    
                    monthMovies.forEach(movie => {
                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        const name = movie.name || movie.title || 'Unknown';
                        card.innerHTML = `
                            <button class="info-btn" onclick="event.stopPropagation(); showMovieDetail('${movie.id}', 'movie')" title="View Details">ℹ️</button>
                            <img src="${movie.poster}" alt="${name}" onclick="showMovieDetail('${movie.id}', 'movie')">
                            <div class="movie-info">
                                <h4><span translate="no">${name}</span></h4>
                                <div class="btn-group-watchlist">
                                    <button class="btn-watched" onclick="confirmMoveToWatched('${movie.id}', '${encodeURIComponent(name)}')">✓ Watched</button>
                                    <button class="btn-remove" onclick="confirmRemoveFromWatchlist('${movie.id}', '${encodeURIComponent(name)}')">✕ Remove</button>
                                </div>
                            </div>
                        `;
                        monthGrid.appendChild(card);
                    });
                    
                    yearContent.appendChild(monthGrid);
                });
            } else {
                const yearGrid = document.createElement('div');
                yearGrid.className = 'grid';
                
                yearData['all'].forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    const name = movie.name || movie.title || 'Unknown';
                    card.innerHTML = `
                        <button class="info-btn" onclick="event.stopPropagation(); showMovieDetail('${movie.id}', 'movie')" title="View Details">ℹ️</button>
                        <img src="${movie.poster}" alt="${name}" onclick="showMovieDetail('${movie.id}', 'movie')">
                        <div class="movie-info">
                            <h4><span translate="no">${name}</span></h4>
                            <div class="btn-group-watchlist">
                                <button class="btn-watched" onclick="confirmMoveToWatched('${movie.id}', '${encodeURIComponent(name)}')">✓ Watched</button>
                                <button class="btn-remove" onclick="confirmRemoveFromWatchlist('${movie.id}', '${encodeURIComponent(name)}')">✕ Remove</button>
                            </div>
                        </div>
                    `;
                    yearGrid.appendChild(card);
                });
                
                yearContent.appendChild(yearGrid);
            }
            
            yearSection.appendChild(yearHeader);
            yearSection.appendChild(yearContent);
            listDiv.appendChild(yearSection);
        });
    }
    
    function toggleWatchlistYear(year) {
        const content = document.getElementById(`content-watchlist-${year}`);
        const toggle = document.getElementById(`toggle-watchlist-${year}`);
        
        content.classList.toggle('collapsed');
        toggle.classList.toggle('collapsed');
    }
    
    function filterWatchlistMovies() {
        const filterText = document.getElementById('filterWatchlistInput').value;
        displayWatchlistMovies(filterText);
    }

    // Remove from Watchlist
    function confirmRemoveFromWatchlist(id, name) {
        const decodedName = decodeURIComponent(name);
        const movie = watchlistMovies.find(m => m.id === id);
        const posterUrl = movie ? movie.poster : '';
        
        showModal('Remove from Watchlist', `Do you want to remove "${decodedName}" from your watchlist?`, (confirmed) => {
            if (confirmed) {
                watchlistMovies = watchlistMovies.filter(m => m.id !== id);
                localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
                displayWatchlistMovies();
            }
        }, 'remove', posterUrl);
    }

    // Move to Watched
    function confirmMoveToWatched(id, name) {
        const decodedName = decodeURIComponent(name);
        const movie = watchlistMovies.find(m => m.id === id);
        
        if (!movie) return;
        
        showModal('Mark as Watched', `Do you want to mark "${decodedName}" as watched?`, (confirmed) => {
            if (confirmed) {
                watchlistMovies = watchlistMovies.filter(m => m.id !== id);
                localStorage.setItem('trnt_watchlist', JSON.stringify(watchlistMovies));
                
                const movieObj = {
                    ...movie,
                    addedDate: new Date().toISOString()
                };
                watchedMovies.push(movieObj);
                localStorage.setItem('trnt_movies', JSON.stringify(watchedMovies));
                
                displayWatchlistMovies();
                displayWatchedMovies();
            }
        }, 'add', movie.poster);
    }

    function toggleWatchedYear(year) {

        toggle.classList.toggle('collapsed');

    function filterWatchedMovies() {
        const filterText = document.getElementById('filterInput').value;
        displayWatchedMovies(filterText);
    }

    // Remove from Watched
    function confirmRemoveMovie(id, name) {
        const decodedName = decodeURIComponent(name);
        const movie = watchedMovies.find(m => m.id === id);
        const posterUrl = movie ? movie.poster : '';
        
        showModal('Remove from Watched', `Do you want to remove "${decodedName}" from your watched list?`, (confirmed) => {
            if (confirmed) {
                watchedMovies = watchedMovies.filter(m => m.id !== id);
                localStorage.setItem('trnt_movies', JSON.stringify(watchedMovies));
                displayWatchedMovies();
            }
        }, 'remove', posterUrl);
    }

    // Enter key to search
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchMovies();
    });
    
    // Toggle Columns
    function toggleColumn(side) {
        const columnMap = {
            'discover': 'discoverColumn',
            'watchlist': 'watchlistColumn',
            'watched': 'watchedColumn'
        };
        const column = document.getElementById(columnMap[side]);
        column.classList.toggle('collapsed');
    }
